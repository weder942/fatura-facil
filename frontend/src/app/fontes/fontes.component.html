<header class="fontes__cabecalho">
  <h1>Fontes</h1>
  <button mat-flat-button type="button" (click)="abrir()">
    <mat-icon>add</mat-icon>
    Nova fonte
  </button>
</header>

@if (fontes().length) {
  <table mat-table [dataSource]="fontes()" class="fontes__tabela">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let fonte">{{ fonte.nome }}</td>
    </ng-container>
    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let fonte">{{ rotuloDoTipo(fonte) }}</td>
    </ng-container>
    <ng-container matColumnDef="fechamento">
      <th mat-header-cell *matHeaderCellDef>Fecha</th>
      <td mat-cell *matCellDef="let fonte">{{ fonte.dia_fechamento ?? '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="vencimento">
      <th mat-header-cell *matHeaderCellDef>Vence</th>
      <td mat-cell *matCellDef="let fonte">{{ fonte.dia_vencimento ?? '—' }}</td>
    </ng-container>
    <ng-container matColumnDef="situacao">
      <th mat-header-cell *matHeaderCellDef>Situação</th>
      <td mat-cell *matCellDef="let fonte">{{ fonte.ativa ? 'Ativa' : 'Inativa' }}</td>
    </ng-container>
    <ng-container matColumnDef="acoes">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let fonte" class="fontes__acoes">
        <button
          mat-icon-button
          type="button"
          (click)="abrir(fonte)"
          [attr.aria-label]="'Editar ' + fonte.nome"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          mat-icon-button
          type="button"
          (click)="excluir(fonte)"
          [attr.aria-label]="'Excluir ' + fonte.nome"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="colunas"></tr>
    <tr
      mat-row
      *matRowDef="let fonte; columns: colunas"
      [class.fontes__inativa]="!fonte.ativa"
    ></tr>
  </table>
} @else {
  <p>Nenhuma fonte cadastrada. Comece pelos cartões e pelo dinheiro.</p>
}
