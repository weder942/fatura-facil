<main class="login">
  <mat-card appearance="outlined" class="login__card">
    <mat-card-header>
      <mat-card-title>Fatura Fácil</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="entrar()" class="login__form">
        <mat-form-field>
          <mat-label>Usuário</mat-label>
          <input matInput formControlName="username" autocomplete="username" />
          @if (form.controls.username.hasError('required')) {
            <mat-error>Informe o usuário.</mat-error>
          }
        </mat-form-field>

        <mat-form-field>
          <mat-label>Senha</mat-label>
          <input
            matInput
            type="password"
            formControlName="password"
            autocomplete="current-password"
          />
          @if (form.controls.password.hasError('required')) {
            <mat-error>Informe a senha.</mat-error>
          }
        </mat-form-field>

        @if (erro(); as mensagem) {
          <p class="login__erro" role="alert">{{ mensagem }}</p>
        }

        <button mat-flat-button type="submit" [disabled]="enviando()">
          {{ enviando() ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</main>
