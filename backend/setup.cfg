[coverage:run]
source = fatura_facil
omit =
    */apps.py
    */migrations/*
    */tests/*
    */__init__.py
    */admin.py

[coverage:report]
fail_under = 93
show_missing = true

[flake8]
ignore = D203,W391,W503
exclude =
    .git,
    .venv,
    venv,
    __pycache__,
    migrations,
    staticfiles
per-file-ignores =
    __init__.py:F401,F403
    config/settings/*.py:F401,F403,F405
max-complexity = 14
max-line-length = 120
